  #   image: nodered/node-red
  #   container_name: node-red
  #   ports:
  #     - 1880:1880
  #   volumes:
  #     - ./node-red:/data
  grafana:
    image: grafana/grafana:7.4.0
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./lib:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini
